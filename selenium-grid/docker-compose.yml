services:
  selenium-hub:
    image: selenium/hub:4.25.0          # use a valid version (latest stable Sep 2025)
    container_name: selenium-hub
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  chrome-node:
    image: selenium/node-chrome:4.25.0  # same version as hub
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    shm_size: "2g"
    volumes:
      - /dev/shm:/dev/shm   # ✅ fixed typo (was /dev/shmpipeline)
